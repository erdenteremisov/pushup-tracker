<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Моя норма отжиманий</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #101316;
    --panel: #171b1e;
    --panel-2: #1f2427;
    --accent: #37e0a1;
    --accent-2: #5aeab5;
    --success: #8fbf6f;
    --gold: #f4c95d;
    --danger: #ff6b5b;
    --text: #f2f4f2;
    --text-dim: #8d9490;
    --border: #2b3134;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    justify-content: center;
    padding: 20px 16px 48px;
    padding-top: max(20px, env(safe-area-inset-top));
  }

  .app { width: 100%; max-width: 560px; }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 22px;
    gap: 12px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand-mark {
    width: 34px;
    height: 34px;
    border-radius: 9px;
    object-fit: cover;
    display: block;
    flex-shrink: 0;
  }

  h1 {
    font-family: 'Big Shoulders Display', sans-serif;
    font-weight: 800;
    font-size: 26px;
    letter-spacing: 0.5px;
    margin: 0;
    line-height: 1;
  }

  .who { font-size: 13px; color: var(--text-dim); white-space: nowrap; }
  .who span.name { color: var(--text); font-weight: 600; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 22px;
    margin-bottom: 16px;
  }

  .hero { text-align: center; }

  .hero .count {
    font-family: 'Big Shoulders Display', sans-serif;
    font-weight: 900;
    font-size: 92px;
    line-height: 0.9;
    letter-spacing: -1px;
  }

  .hero .count .goal { font-size: 38px; color: var(--text-dim); font-weight: 600; }
  .hero .label { color: var(--text-dim); font-size: 14px; margin-top: 6px; }
  .hero .label.done { color: var(--accent); font-weight: 600; }
  .hero .overflow { color: var(--gold); font-size: 13px; margin-top: 2px; font-weight: 600; }

  .tally {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 5px;
    margin: 20px 0 6px;
  }

  .tally .seg {
    height: 14px;
    border-radius: 3px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    transition: background 0.25s ease, border-color 0.25s ease;
  }

  .tally .seg.full { background: var(--accent); border-color: var(--accent); }
  .tally .seg.over { background: var(--gold); border-color: var(--gold); }

  .tally-caption { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-dim); }

  .add-row { display: flex; gap: 8px; margin-top: 20px; flex-wrap: wrap; }

  button {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 15px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    padding: 11px 16px;
    cursor: pointer;
    transition: transform 0.08s ease, background 0.15s ease, border-color 0.15s ease;
  }

  button:hover { border-color: var(--accent); }
  button:active { transform: scale(0.96); }

  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #0c100e;
    flex: 1;
    min-width: 140px;
    font-weight: 700;
  }

  button.primary:hover { background: var(--accent-2); border-color: var(--accent-2); }

  .kruzhok-btn {
    display: block;
    width: 100%;
    margin-top: 14px;
    padding: 13px 16px;
    background: #229ed9;
    border: 1px solid #229ed9;
    border-radius: 8px;
    color: #fff;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 15px;
    text-align: center;
    cursor: pointer;
  }
  .kruzhok-btn:hover { background: #1c8bc2; border-color: #1c8bc2; }

  button.link-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    text-decoration: underline;
    padding: 4px 0;
    font-size: 13px;
  }

  button.link-btn:hover { color: var(--accent-2); border: none; }

  .custom-row { display: flex; gap: 8px; margin-top: 10px; }

  .custom-row input, .edit-row input {
    flex: 1;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px;
    padding: 11px 12px;
    min-width: 0;
  }

  .custom-row input:focus, .edit-row input:focus { outline: none; border-color: var(--accent); }

  .edit-row { display: flex; gap: 8px; margin-top: 12px; }
  .edit-actions { display: flex; gap: 8px; margin-top: 10px; }
  .field-error { color: var(--danger); font-size: 12px; margin-top: 6px; }

  .strip { display: flex; align-items: center; justify-content: space-between; gap: 16px; }

  .streak-num { font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 34px; color: var(--accent); }
  .streak-text { font-size: 13px; color: var(--text-dim); }

  .calendar { display: grid; grid-template-columns: repeat(15, 1fr); gap: 4px; margin-top: 14px; }
  .calendar .day { aspect-ratio: 1; border-radius: 3px; background: var(--panel-2); border: 1px solid var(--border); }
  .calendar .day.some { background: #7a6a2f; border-color: #7a6a2f; }
  .calendar .day.done { background: var(--accent); border-color: var(--accent); }

  h2 { font-family: 'Big Shoulders Display', sans-serif; font-weight: 700; font-size: 18px; margin: 0 0 4px; }
  .sub { font-size: 13px; color: var(--text-dim); margin: 0 0 6px; }

  table.board { width: 100%; border-collapse: collapse; margin-top: 14px; }
  table.board th {
    text-align: left; font-size: 12px; color: var(--text-dim);
    font-weight: 500; padding: 6px 8px; border-bottom: 1px solid var(--border);
  }
  table.board td { padding: 10px 8px; font-size: 15px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  table.board tr:last-child td { border-bottom: none; }
  table.board td.rank { color: var(--text-dim); width: 24px; }
  table.board tr.me td { color: var(--accent-2); font-weight: 600; }
  table.board td.today-count {
    text-align: right; font-family: 'Big Shoulders Display', sans-serif; font-weight: 700; font-size: 19px;
  }
  table.board td.today-count .pct { font-family: 'Space Grotesk', sans-serif; font-weight: 500; font-size: 11px; color: var(--text-dim); }
  table.board tr.me td.today-count .pct { color: var(--accent-2); }
  table.board td.streak-cell { text-align: right; color: var(--accent); font-size: 13px; width: 70px; white-space: nowrap; }

  .empty { color: var(--text-dim); font-size: 14px; padding: 8px 0; }
  .error-banner {
    background: #3a2420; border: 1px solid var(--danger); color: var(--danger);
    border-radius: 8px; padding: 12px 14px; font-size: 13px; margin-bottom: 16px;
  }

  .status-line { text-align: center; color: var(--text-dim); font-size: 13px; padding: 20px 0; }

  /* Onboarding / goal picker */
  .onboarding h2 { font-size: 22px; text-align: center; margin-bottom: 6px; }
  .onboarding .sub { text-align: center; margin-bottom: 20px; }

  .preset-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 14px; }
  .preset-row button { min-width: 56px; text-align: center; }
  .preset-row button.selected { background: var(--accent); border-color: var(--accent); color: #0c100e; }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
    padding: 20px;
  }
  .modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    max-width: 360px;
    width: 100%;
  }

  .settings-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .settings-row .goal-value { font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 26px; }

  /* Stats screen */
  .stats-title { font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 20px; letter-spacing: 0.3px; }
  .stats-grid { display: flex; margin-top: 18px; border-top: 1px solid var(--border); padding-top: 16px; }
  .stats-cell { flex: 1; text-align: center; }
  .stats-val { font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 24px; }
  .stats-cap { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

  .hist-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .hist-row:last-child { border-bottom: none; }
  .hist-date { font-family: 'Big Shoulders Display', sans-serif; font-weight: 700; font-size: 15px; width: 58px; flex-shrink: 0; color: var(--text-dim); }
  .hist-mid { flex: 1; font-size: 13px; color: var(--text-dim); }
  .hist-lbl { color: var(--text-dim); }
  .hist-mid .hist-line { color: var(--text); }
  .hist-mid .hist-line .hist-lbl { color: var(--text-dim); margin-right: 4px; }
  .hist-status { font-size: 13px; font-weight: 700; white-space: nowrap; }
  .hist-status.ok { color: var(--accent); }
  .hist-status.no { color: var(--danger); }
</style>
</head>

  (SUPABASE_ANON_KEY.startsWith("ey") || SUPABASE_ANON_KEY.startsWith("sb_"));

/* Локальная (а не UTC) дата — иначе вечерняя запись могла бы уезжать
   в соседний календарный день у пользователей восточнее/западнее UTC. */
function pad2(n) { return String(n).padStart(2, '0'); }
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
}
function dateStr(offsetDays) {
  const d = new Date();
  d.setDate(d.getDate() + offsetDays);
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
}
function formatDateHuman(dstr) {
  const d = new Date(dstr + 'T00:00:00');
  return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
}
function formatDateShort(dstr) {
  const d = new Date(dstr + 'T00:00:00');
  return d.getDate() + ' ' + MONTHS_SHORT[d.getMonth()];
}

function getTelegramIdentity() {
  if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
    const u = tg.initDataUnsafe.user;
    const name = [u.first_name, u.last_name].filter(Boolean).join(' ') || u.username || ('user' + u.id);
    return { id: String(u.id), name };
  }
  let id = localStorage.getItem('fallback_id');
  let name = localStorage.getItem('fallback_name');
  if (!id) {
    id = 'local-' + Math.random().toString(36).slice(2, 10);
    localStorage.setItem('fallback_id', id);
  }
  if (!name) {
    name = prompt('Тестовый режим (не в Telegram). Введи имя:') || 'Гость';
    localStorage.setItem('fallback_name', name);
  }
  return { id, name };
}

/* ---------------- History entry helpers ----------------
   Каждый день хранится как { count, goal } — цель именно ТОГО дня.
   Старые записи (просто число) читаем как count с текущей целью в качестве
   запасного значения, чтобы ничего не потерялось при переходе. */

function normalizeEntry(raw, fallbackGoal) {
  if (raw === undefined || raw === null) return null;
  if (typeof raw === 'number') return { count: raw, goal: fallbackGoal };
  const count = Number.isFinite(raw.count) ? raw.count : 0;
  const goal = Number.isFinite(raw.goal) && raw.goal > 0 ? raw.goal : fallbackGoal;
  return { count, goal };
}

function getEntry(history, date, fallbackGoal) {
  return normalizeEntry(history[date], fallbackGoal);
}

function dayMet(history, date, fallbackGoal) {
  const entry = getEntry(history, date, fallbackGoal);
  return entry ? entry.count >= entry.goal : false;
}

function computeStreak(history, currentGoal) {
  let streak = 0;
  let dayOffset = dayMet(history, todayStr(), currentGoal) ? 0 : -1;
  while (dayMet(history, dateStr(dayOffset), currentGoal)) {
    streak++;
    dayOffset--;
  }
  return streak;
}

function streakEndingOn(history, dateStr0, currentGoal) {
  let streak = 0;
  let d = new Date(dateStr0 + 'T00:00:00');
  while (true) {
    const ds = d.toISOString().slice(0, 10);
    if (!dayMet(history, ds, currentGoal)) break;
    streak++;
    d.setDate(d.getDate() - 1);
  }
  return streak;
}

function pointsForDay(history, dateStr0, currentGoal) {
  const entry = getEntry(history, dateStr0, currentGoal);
  if (!entry || entry.count <= 0) return 0;
  const pct = entry.goal > 0 ? Math.min(Math.round((entry.count / entry.goal) * 100), 100) : 0;
  const streakLen = streakEndingOn(history, dateStr0, currentGoal);
  const bonus = streakLen >= 1 ? Math.min(STREAK_BONUS_PER_DAY * (streakLen - 1), STREAK_BONUS_CAP) : 0;
  return pct + bonus;
}

function weeklyPoints(history, currentGoal) {
  let sum = 0;
  for (let i = 0; i < LEADERBOARD_WINDOW_DAYS; i++) {
    sum += pointsForDay(history, dateStr(-i), currentGoal);
  }
  return sum;
}

function totalAndRecord(history) {
  let total = 0, record = 0;
  Object.keys(history).forEach(d => {
    const raw = history[d];
    const count = typeof raw === 'number' ? raw : (raw && Number.isFinite(raw.count) ? raw.count : 0);
    total += count;
    if (count > record) record = count;
  });
  return { total, record };
}

function daysDoneSinceJoin(history, joinedAt, currentGoal) {
  if (!joinedAt) return { done: 0, total: JOIN_WINDOW_DAYS };
  const start = new Date(joinedAt + 'T00:00:00');
  const today = new Date(todayStr() + 'T00:00:00');
  let done = 0;
  for (let i = 0; i < JOIN_WINDOW_DAYS; i++) {
    const d = new Date(start);
    d.setDate(d.getDate() + i);
    if (d > today) break;
    const ds = d.toISOString().slice(0, 10);
    if (dayMet(history, ds, currentGoal)) done++;
  }
  return { done, total: JOIN_WINDOW_DAYS };
}

let state = {
  identity: null,
  data: null,           // { goal, history, streak, joinedAt }
  leaderboard: [],
  configError: false,
  loadError: false,
  view: 'loading',       // 'loading' | 'onboarding' | 'main' | 'edit-result' | 'settings-goal' | 'stats'
  pendingGoalSelection: null,
};

/* ---------------- Data layer ---------------- */

async function loadUser(id) {
  const { data, error } = await supabaseClient
    .from(TABLE_NAME)
    .select('*')
    .eq('id', id)
    .maybeSingle();
  if (error) throw error;
  if (!data) return { goal: null, history: {}, streak: 0, joinedAt: null };
  return {
    goal: (data.goal === null || data.goal === undefined) ? null : data.goal,
    history: data.history || {},
    streak: data.streak || 0,
    joinedAt: data.joined_at || null,
  };
}

async function saveUser(id, name, data) {
  const { error } = await supabaseClient
    .from(TABLE_NAME)
    .upsert({
      id,
      name,
      goal: data.goal,
      history: data.history,
      streak: data.streak,
      joined_at: data.joinedAt,
      updated_at: new Date().toISOString(),
    });
  if (error) throw error;
}

async function fetchLeaderboard() {
  const { data, error } = await supabaseClient.from(TABLE_NAME).select('*');
  if (error) throw error;
  const today = todayStr();
  const entries = (data || []).map(row => {
    const goal = (row.goal === null || row.goal === undefined) ? DEFAULT_GOAL : row.goal;
    const history = row.history || {};
    const todayEntry = getEntry(history, today, goal);
    const todayCount = todayEntry ? todayEntry.count : 0;
    const pct = goal > 0 ? Math.round((todayCount / goal) * 100) : 0;
    return {
      id: String(row.id),
      name: row.name,
      todayCount,
      pct,
      points: weeklyPoints(history, goal),
      // Текущая серия считается заново из истории, а не берётся из
      // сохранённого поля — иначе у неактивных игроков она "застревала".
      streak: computeStreak(history, goal),
    };
  });
  entries.sort((a, b) => b.points - a.points || b.streak - a.streak);
  return entries;
}

/* ---------------- Init ---------------- */

async function init() {
  if (!supabaseClient) {
    state.configError = true;
    render();
    return;
  }

  state.identity = getTelegramIdentity();
  try {
    state.data = await loadUser(state.identity.id);
  } catch (e) {
    console.error(e);
    state.data = { goal: null, history: {}, streak: 0, joinedAt: null };
    state.loadError = true;
  }

  const isBrandNew = Object.keys(state.data.history).length === 0;

  if (!state.data.joinedAt) {
    if (isBrandNew) {
      state.data.joinedAt = todayStr();
    } else {
      const earliest = Object.keys(state.data.history).sort()[0];
      state.data.joinedAt = earliest || todayStr();
    }
  }

  if (state.data.goal === null || state.data.goal === undefined) {
    state.data.goal = DEFAULT_GOAL;
    state.view = isBrandNew ? 'onboarding' : 'main';
  } else {
    state.view = 'main';
  }

  // Серия всегда пересчитывается заново при открытии — если пользователь
  // не заходил несколько дней, старое сохранённое значение не должно
  // "висеть" устаревшим до следующего действия.
  state.data.streak = computeStreak(state.data.history, state.data.goal);

  render();
  if (state.view === 'main') refreshLeaderboard();
}

/* ---------------- Actions ---------------- */

async function persist() {
  try {
    await saveUser(state.identity.id, state.identity.name, state.data);
  } catch (e) {
    console.error('Save failed', e);
  }
}

async function addReps(n) {
  if (!Number.isInteger(n) || n <= 0) return;
  const today = todayStr();
  const currentEntry = getEntry(state.data.history, today, state.data.goal);
  const newCount = (currentEntry ? currentEntry.count : 0) + n;
  state.data.history[today] = { count: newCount, goal: state.data.goal };
  state.data.streak = computeStreak(state.data.history, state.data.goal);
  render();
  await persist();
  refreshLeaderboard();
}

async function setResultForToday(value) {
  const today = todayStr();
  state.data.history[today] = { count: value, goal: state.data.goal };
  state.data.streak = computeStreak(state.data.history, state.data.goal);
  state.view = 'main';
  render();
  await persist();
  refreshLeaderboard();
}

async function confirmGoal(newGoal) {
  const wasOnboarding = state.view === 'onboarding';
  state.data.goal = newGoal;
  // Прошлые дни уже хранят свою собственную цель — пересчёт стрика
  // затрагивает только сегодня и дни без сохранённой цели.
  state.data.streak = computeStreak(state.data.history, state.data.goal);
  state.view = 'main';
  render();
  await persist();
  if (!wasOnboarding) refreshLeaderboard();
}

async function refreshLeaderboard() {
  try {
    state.leaderboard = await fetchLeaderboard();
  } catch (e) {
    console.error(e);
    state.leaderboard = null;
  }
  renderLeaderboard();
}

/* ---------------- Render ---------------- */

function render() {
  const app = document.getElementById('app');

  if (state.configError) {
    app.innerHTML = `
      <div class="error-banner">
        Трекер не настроен: впиши SUPABASE_URL и SUPABASE_ANON_KEY в начале файла, иначе данные никуда не сохранятся.
      </div>
    `;
    return;
  }

  if (state.view === 'onboarding') {
    renderOnboarding();
    return;
  }

  if (state.view === 'stats') {
    renderStats();
    return;
  }

  renderMain();

  if (state.view === 'settings-goal') {
    renderGoalModal('settings');
  }
}

function renderGoalPickerBody(mode, currentGoal) {
  const selected = state.pendingGoalSelection ?? currentGoal;
  const presetsHtml = GOAL_PRESETS.map(p => `
    <button data-preset="${p}" class="${p === selected ? 'selected' : ''}">${p}</button>
  `).join('');

  return `
    <div class="preset-row">${presetsHtml}</div>
    <div class="custom-row">
      <input id="goal-custom-input" type="number" min="1" placeholder="своё число" />
      <button id="goal-custom-set">Ок</button>
    </div>
    <div class="edit-actions" style="margin-top:18px">
      <button class="primary" id="goal-confirm">${mode === 'onboarding' ? 'Начать' : 'Сохранить'}</button>
      ${mode === 'settings' ? '<button class="link-btn" id="goal-cancel">Отмена</button>' : ''}
    </div>
  `;
}

function renderOnboarding() {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="panel onboarding">
      <div style="text-align:center;margin-bottom:14px;"><img src="${BRAND_LOGO}" class="brand-mark" style="width:52px;height:52px;border-radius:14px;"></div>
      <h2>Сколько отжиманий ты хочешь делать каждый день?</h2>
      <p class="sub">Выбери комфортное количество. Его можно изменить позже.</p>
      ${renderGoalPickerBody('onboarding', DEFAULT_GOAL)}
    </div>
  `;
  bindGoalPickerEvents('onboarding');
}

function renderGoalModal(mode) {
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.id = 'goal-modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal">
      <h2>Выбери новую дневную норму</h2>
      ${renderGoalPickerBody(mode, state.data.goal)}
    </div>
  `;
  document.body.appendChild(backdrop);
  bindGoalPickerEvents(mode);
  const cancelBtn = document.getElementById('goal-cancel');
  if (cancelBtn) {
    cancelBtn.onclick = () => {
      state.pendingGoalSelection = null;
      state.view = 'main';
      closeGoalModal();
    };
  }
}

function closeGoalModal() {
  const el = document.getElementById('goal-modal-backdrop');
  if (el) el.remove();
}

function bindGoalPickerEvents(mode) {
  document.querySelectorAll('[data-preset]').forEach(btn => {
    btn.onclick = () => {
      state.pendingGoalSelection = parseInt(btn.dataset.preset, 10);
      document.querySelectorAll('[data-preset]').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    };
  });
  const customSet = document.getElementById('goal-custom-set');
  if (customSet) {
    customSet.onclick = () => {
      const input = document.getElementById('goal-custom-input');
      const val = parseInt(input.value, 10);
      if (Number.isInteger(val) && val > 0) {
        state.pendingGoalSelection = val;
        document.querySelectorAll('[data-preset]').forEach(b => b.classList.remove('selected'));
      }
    };
  }
  const confirmBtn = document.getElementById('goal-confirm');
  if (confirmBtn) {
    confirmBtn.onclick = () => {
      // Если в поле "своё число" уже что-то введено, оно побеждает,
      // даже если пользователь не успел нажать отдельную кнопку "Ок" —
      // иначе набранное значение молча терялось при нажатии "Сохранить".
      let chosen = state.pendingGoalSelection ?? state.data.goal ?? DEFAULT_GOAL;
      const liveInput = document.getElementById('goal-custom-input');
      if (liveInput && liveInput.value.trim() !== '') {
        const liveVal = parseInt(liveInput.value, 10);
        if (Number.isInteger(liveVal) && liveVal > 0) chosen = liveVal;
      }
      state.pendingGoalSelection = null;
      if (mode === 'settings') closeGoalModal();
      confirmGoal(chosen);
    };
  }
  const customInputEl = document.getElementById('goal-custom-input');
  if (customInputEl) {
    customInputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && confirmBtn) confirmBtn.click();
    });
  }
}

function renderMain() {
  const app = document.getElementById('app');
  const today = todayStr();
  const goal = state.data.goal;
  const todayEntry = getEntry(state.data.history, today, goal);
  const todayCount = todayEntry ? todayEntry.count : 0;
  const remaining = Math.max(goal - todayCount, 0);
  const over = Math.max(todayCount - goal, 0);
  const done = todayCount >= goal;

  const segCount = goal > 0 ? Math.min(Math.floor((todayCount / goal) * SEGMENTS), SEGMENTS) : 0;
  let tallyHtml = '';
  for (let i = 0; i < SEGMENTS; i++) {
    let cls = 'seg';
    if (i < segCount) cls += done ? ' over' : ' full';
    tallyHtml += `<div class="${cls}"></div>`;
  }

  let calHtml = '';
  for (let i = 29; i >= 0; i--) {
    const d = dateStr(-i);
    const entry = getEntry(state.data.history, d, goal);
    const c = entry ? entry.count : 0;
    const dGoal = entry ? entry.goal : goal;
    let cls = 'day';
    if (c >= dGoal) cls += ' done';
    else if (c > 0) cls += ' some';
    const status = c >= dGoal ? 'норма выполнена' : (c > 0 ? 'норма не выполнена' : 'ничего не отмечено');
    calHtml += `<div class="${cls}" title="${formatDateHuman(d)}: ${c} (норма ${dGoal}) — ${status}"></div>`;
  }

  const addRowButtons = `
    <button data-add="5">+5</button>
    <button data-add="10">+10</button>
    <button data-add="20">+20</button>
    ${remaining > 0 ? `<button class="primary" data-add="${remaining}">Выполнить норму</button>` : ''}
  `;

  app.innerHTML = `
    <header>
      <div class="brand">
        <img src="${BRAND_LOGO}" class="brand-mark">
        <h1>ПРОСТО ДЕЛАЙ</h1>
      </div>
      <div class="who">Это <span class="name">${escapeHtml(state.identity.name)}</span></div>
    </header>

    ${state.loadError ? '<div class="error-banner">Не удалось загрузить твои данные, но можно продолжать — новые повторения сохранятся.</div>' : ''}

    <div class="panel hero">
      <div class="count">${todayCount}<span class="goal"> / ${goal}</span></div>
      <div class="label ${done ? 'done' : ''}">${done ? 'Норма выполнена ✓' : `осталось ${remaining}`}</div>
      ${over > 0 ? `<div class="overflow">+${over} сверх нормы</div>` : ''}

      <div class="tally">${tallyHtml}</div>
      <div class="tally-caption"><span>0</span><span>норма: ${goal}</span><span>${goal}</span></div>

      ${remaining <= KRUZHOK_THRESHOLD ? `<button class="kruzhok-btn" id="kruzhok-btn">🎥 Отметить выполнение</button>` : ''}

      ${state.view === 'edit-result' ? renderEditPanel(todayCount) : `
        <div class="add-row">${addRowButtons}</div>
        <div class="custom-row">
          <input id="custom-input" type="number" min="1" placeholder="своё число" />
          <button id="custom-add">Добавить</button>
        </div>
        <div style="margin-top:10px; text-align:center">
          <button class="link-btn" id="edit-result-btn">Изменить результат</button>
        </div>
      `}
    </div>

    <div class="panel strip">
      <div>
        <div class="streak-num">🔥 ${state.data.streak}</div>
        <div class="streak-text">${state.data.streak === 1 ? 'день подряд' : 'дней подряд'}</div>
      </div>
      <div style="flex:1"><div class="calendar">${calHtml}</div></div>
    </div>

    <div class="panel" style="text-align:center;">
      <button class="primary" id="open-stats" style="width:100%;">Моя статистика</button>
    </div>

    <div class="panel" id="leaderboard-panel">
      <h2>Рейтинг недели</h2>
      <p class="sub">Очки за % выполнения + бонус за серию, сумма за последние 7 дней</p>
      <div id="leaderboard-body"><div class="empty">Загрузка рейтинга…</div></div>
    </div>

    <div class="panel settings-row">
      <div>
        <div class="sub" style="margin-bottom:2px">Твоя дневная норма</div>
        <div class="goal-value">${goal} отжиманий</div>
      </div>
      <button id="open-settings-goal">Изменить</button>
    </div>
  `;

  if (state.view === 'edit-result') {
    bindEditPanelEvents();
  } else {
    document.querySelectorAll('[data-add]').forEach(btn => {
      btn.onclick = () => addReps(parseInt(btn.dataset.add, 10));
    });
    document.getElementById('custom-add').onclick = () => {
      const input = document.getElementById('custom-input');
      const val = parseInt(input.value, 10);
      if (Number.isInteger(val) && val > 0) { addReps(val); input.value = ''; }
    };
    document.getElementById('custom-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('custom-add').click();
    });
    document.getElementById('edit-result-btn').onclick = () => {
      state.view = 'edit-result';
      render();
    };
  }

  document.getElementById('open-settings-goal').onclick = () => {
    state.pendingGoalSelection = null;
    state.view = 'settings-goal';
    render();
  };

  document.getElementById('open-stats').onclick = () => {
    state.view = 'stats';
    render();
  };

  const kruzhokBtn = document.getElementById('kruzhok-btn');
  if (kruzhokBtn) {
    kruzhokBtn.onclick = () => {
      if (tg && tg.openTelegramLink) {
        tg.openTelegramLink(BOT_LINK);
      } else {
        window.open(BOT_LINK, '_blank');
      }
    };
  }

  renderLeaderboard();
}

function renderEditPanel(currentValue) {
  return `
    <div class="edit-row">
      <input id="edit-result-input" type="number" min="0" value="${currentValue}" />
    </div>
    <div id="edit-error" class="field-error" style="display:none">Введи целое число не меньше 0.</div>
    <div class="edit-actions">
      <button class="primary" id="edit-save">Сохранить</button>
      <button class="link-btn" id="edit-cancel">Отмена</button>
    </div>
  `;
}

function bindEditPanelEvents() {
  const saveBtn = document.getElementById('edit-save');
  const cancelBtn = document.getElementById('edit-cancel');
  if (!saveBtn) return;
  saveBtn.onclick = () => {
    const input = document.getElementById('edit-result-input');
    const raw = String(input.value).trim();
    const val = parseInt(raw, 10);
    const errEl = document.getElementById('edit-error');
    if (raw === '' || !Number.isInteger(val) || val < 0) {
      errEl.style.display = 'block';
      return;
    }
    setResultForToday(val);
  };
  cancelBtn.onclick = () => {
    state.view = 'main';
    render();
  };
  document.getElementById('edit-result-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') saveBtn.click();
  });
}

function renderStats() {
  const app = document.getElementById('app');
  const { total, record } = totalAndRecord(state.data.history);
  const { done, total: totalDays } = daysDoneSinceJoin(state.data.history, state.data.joinedAt, state.data.goal);

  // Список строится по календарным датам от дня вступления до сегодня —
  // а не по ключам history — иначе дни без записи просто "выпадали" бы
  // из статистики вместо того, чтобы показаться как пропуск.
  const startStr = state.data.joinedAt || todayStr();
  const start = new Date(startStr + 'T00:00:00');
  const today = new Date(todayStr() + 'T00:00:00');
  const allDates = [];
  for (let d = new Date(start); d <= today; d.setDate(d.getDate() + 1)) {
    allDates.push(`${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`);
  }
  allDates.reverse();

  let rows = '';
  allDates.forEach(d => {
    const entry = getEntry(state.data.history, d, state.data.goal);
    if (!entry) {
      rows += `
        <div class="hist-row">
          <div class="hist-date">${formatDateShort(d)}</div>
          <div class="hist-mid">
            <div class="hist-line"><span class="hist-lbl">Цель</span> ${state.data.goal}</div>
            <div class="hist-line"><span class="hist-lbl">Факт</span> 0</div>
          </div>
          <div class="hist-status no">✕ Пропуск</div>
        </div>
      `;
      return;
    }
    const met = entry.count >= entry.goal;
    rows += `
      <div class="hist-row">
        <div class="hist-date">${formatDateShort(d)}</div>
        <div class="hist-mid">
          <div class="hist-line"><span class="hist-lbl">Цель</span> ${entry.goal}</div>
          <div class="hist-line"><span class="hist-lbl">Факт</span> ${entry.count}</div>
        </div>
        <div class="hist-status ${met ? 'ok' : 'no'}">${met ? '✓ Выполнено' : '✕ Не выполнено'}</div>
      </div>
    `;
  });

  app.innerHTML = `
    <header>
      <button class="link-btn" id="stats-back">← Назад</button>
      <div class="who">Это <span class="name">${escapeHtml(state.identity.name)}</span></div>
    </header>

    <div class="panel" style="text-align:center;">
      <div class="stats-title">Моя статистика</div>
      <div class="streak-num" style="margin-top:12px;">🔥 ${state.data.streak}</div>
      <div class="streak-text">${state.data.streak === 1 ? 'день подряд' : 'дней подряд'}</div>

      <div class="stats-grid">
        <div class="stats-cell">
          <div class="stats-val">${done} / ${totalDays}</div>
          <div class="stats-cap">дней выполнено</div>
        </div>
        <div class="stats-cell">
          <div class="stats-val">${total.toLocaleString('ru-RU')}</div>
          <div class="stats-cap">всего отжиманий</div>
        </div>
        <div class="stats-cell">
          <div class="stats-val">${record}</div>
          <div class="stats-cap">личный рекорд</div>
        </div>
      </div>
    </div>

    <div class="panel">
      <h2>История</h2>
      <p class="sub">Цель того дня — не сегодняшняя</p>
      ${rows || '<div class="empty">Пока нет записей.</div>'}
    </div>
  `;

  document.getElementById('stats-back').onclick = () => {
    state.view = 'main';
    render();
    refreshLeaderboard();
  };
}

function renderLeaderboard() {
  const el = document.getElementById('leaderboard-body');
  if (!el) return;
  if (state.leaderboard === null) {
    el.innerHTML = '<div class="empty">Не удалось загрузить рейтинг.</div>';
    return;
  }
  if (!state.leaderboard.length) {
    el.innerHTML = '<div class="empty">Пока никто не отметился.</div>';
    return;
  }
  let rows = '';
  state.leaderboard.forEach((entry, i) => {
    const mine = entry.id === state.identity.id;
    rows += `
      <tr class="${mine ? 'me' : ''}">
        <td class="rank">${i + 1}</td>
        <td>${escapeHtml(entry.name)}</td>
        <td class="today-count">${entry.points}<div class="pct">${entry.pct}% сегодня</div></td>
        <td class="streak-cell">${entry.streak > 0 ? '🔥 ' + entry.streak : '—'}</td>
      </tr>
    `;
  });
  el.innerHTML = `
    <table class="board">
      <thead><tr><th></th><th>Имя</th><th style="text-align:right">Очки · 7 дн.</th><th style="text-align:right">Серия</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

init();
</script>

</body>
</html>
